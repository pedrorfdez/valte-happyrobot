<style>
body{margin:0;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans);}
a{color:var(--info);}a:hover{color:var(--ink);}
.wave{fill:none;stroke:var(--line-strong);stroke-width:1;opacity:.55;}
.row{appearance:none;background:none;border:0;border-bottom:1px solid var(--line-strong);color:var(--ink);cursor:pointer;text-align:left;font:inherit;transition:padding .2s ease;}
.row:hover{padding-left:12px;}
.row:hover .row-name{font-style:italic;}
.row .row-arrow{opacity:0;transform:translateX(-8px);transition:opacity .2s ease,transform .2s ease;}
.row:hover .row-arrow{opacity:1;transform:none;}
.row:focus-visible,.cta:focus-visible{outline:2px solid var(--focus);outline-offset:4px;}
.cta:hover .cta-arrow{transform:translateX(4px);}
.cta-arrow{transition:transform .2s ease;}
.cta,.cta:hover{color:var(--on-ink);}

/* Additions for the live app (everything else is the design's own CSS). */
html{background:var(--surface-000);}
.vt-sev__num{display:none;} /* severity reads from the bars alone: no number beside them */
.kpi-link.is-on .kpi-go,.kpi-link.is-on:hover .kpi-go{transform:rotate(180deg);} /* the open submenu's arrow points back: pressing it again leaves */
/* entity dropdown in the panel header: the selected entity, opening onto every entity by role */
.vl-ent{position:relative;}
.vl-ent__btn{flex-direction:row;align-items:center;gap:14px;min-width:220px;cursor:pointer;list-style:none;user-select:none;}
.vl-ent__btn::-webkit-details-marker{display:none;}
.vl-ent__btn.seg.is-on:hover{background:var(--ink);color:var(--on-ink);opacity:.92;}
.vl-ent__txt{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0;}
.vl-ent__chev{flex-shrink:0;transition:transform .15s ease;}
.vl-ent[open] .vl-ent__chev{transform:rotate(180deg);}
.vl-ent:not([open]) .vl-ent__menu{display:none;}
.vl-ent__menu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;display:flex;gap:8px;padding:12px;max-height:640px;overflow:auto;
  background:var(--surface-100);border:1px solid var(--line-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-pop);}
.vl-ent__group{display:flex;flex-direction:column;gap:2px;min-width:200px;}
.vl-ent__group>.seg-kind{padding:4px 10px 6px;}
.vl-ent__opt{display:block;padding:7px 10px;border-radius:var(--radius-sm);font-size:14px;line-height:20px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap;}
.vl-ent__opt:hover{background:var(--surface-200);color:var(--ink);}
.vl-ent__opt.is-on,.vl-ent__opt.is-on:hover{background:var(--ink);color:var(--on-ink);}
.vl-ent__opt:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
.vl-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;background:var(--ink);color:var(--on-ink);
  font:500 14px/20px var(--font-sans);padding:10px 18px;border-radius:var(--radius-md);box-shadow:var(--shadow-pop);max-width:720px;}
.vl-toast.is-ok{background:var(--success);color:#fff}.vl-toast.is-warn{background:var(--warning);color:var(--on-warning)}
.vl-toast.is-bad{background:var(--critical);color:var(--on-critical)}
.ringbar{position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-md);
  background:var(--agent-soft);color:var(--ink);font-size:14px;line-height:20px;border:1px solid var(--agent);}
.ringdot{width:10px;height:10px;border-radius:50%;background:var(--agent);animation:vl-pulse 1s ease-in-out infinite;flex-shrink:0;}
@keyframes vl-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
.vl-empty{padding:24px 0;color:var(--ink-muted);font-size:14px;line-height:20px;}
.vl-tab{appearance:none;cursor:pointer;}
.vl-origin-tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);}
.vl-change{display:grid;grid-template-columns:38px 16px minmax(0,1fr);column-gap:8px;align-items:center;padding:4px 0;font-size:13px;line-height:18px;color:var(--ink);text-decoration:none;}
.vl-change:hover{color:var(--ink);background:var(--surface-200);}
.vl-g{font-size:12px;text-align:center;}.vl-g.is-critical{color:var(--critical);}.vl-g.is-warning{color:var(--warning-text);}
.vl-g.is-agent{color:var(--agent);}.vl-g.is-success{color:var(--success);}.vl-g.is-info{color:var(--info);}.vl-g.is-neutral{color:var(--ink-muted);}
.tab.vl-zonechip{background:var(--info-soft);border-color:var(--info);color:var(--info);}
.vl-change .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.vl-scrim{position:absolute;inset:0;border:0;padding:0;margin:0;background:rgba(14,13,12,.45);cursor:pointer;}
.vl-dlg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:860px;max-height:840px;overflow:auto;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:18px;background:var(--surface-100);color:var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);}
.vl-x{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:none;color:var(--ink);cursor:pointer;font-size:18px;}
.vl-x:hover{background:var(--surface-200);}
.vl-row{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:20px;}
.vl-prio{font-family:var(--font-mono);font-size:12px;font-weight:500;}
.vl-prio.p0{color:var(--critical);}.vl-prio.p1{color:var(--warning-text);}.vl-prio.p2{color:var(--info);}.vl-prio.p3{color:var(--ink-muted);}
.vl-sub{color:var(--ink-muted);font-size:12px;line-height:16px;}
.vl-more{appearance:none;border:0;background:none;padding:6px 0 0;font:500 13px/18px var(--font-sans);color:var(--agent);cursor:pointer;text-align:left;}
.vl-more:hover{text-decoration:underline;}
.vl-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;}
.vl-chips{display:flex;flex-wrap:wrap;gap:6px;}
.vl-chipbtn{appearance:none;font:500 13px/20px var(--font-sans);padding:6px 12px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:none;color:var(--ink);cursor:pointer;}
.vl-chipbtn:hover{background:var(--surface-200);}.vl-chipbtn.is-on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);}
.vl-fl{display:flex;flex-direction:column;gap:6px;}
.vl-in{font:400 15px/22px var(--font-sans);color:var(--ink);background:var(--surface-100);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:9px 12px;width:100%;box-sizing:border-box;resize:none;}
.vl-in:focus{outline:2px solid var(--focus);outline-offset:1px;}
/* what the population gets: a note on how much its word weighs */
.vl-note{padding:12px 14px;border-radius:var(--radius-md);background:var(--info-soft);border:1px solid var(--info);color:var(--ink);font-size:13px;line-height:20px;}

/* lessons in the "plan, reflejos y lo aprendido" dialog */
.vl-used{color:var(--agent);}
.vl-teach{border:0;background:none;padding:0;color:var(--agent);font:inherit;font-size:12px;letter-spacing:0;text-transform:none;cursor:pointer;}
.vl-teach:hover{text-decoration:underline;}

/* with a single zone there is no Zonas screen: its tile (and the zone row that would open it) is not a button */
.kpi-link.is-off{pointer-events:none;cursor:default;}
.kpi-link.is-off .kpi-go{display:none;}
.is-still{pointer-events:none;cursor:default;}

.vl-stack{max-height:660px;overflow-y:auto;scrollbar-width:thin;}

</style>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount() {
    // All of them, not only the active ones: a new crisis stacks on top, it never replaces another.
    ValteLive.bind(this, function () { return ValteLive.get('/crises'); }, { noCrisis: true });
  }
  componentWillUnmount() { ValteLive.unbind(this); }
  renderVals() {
    var st = this.state || {}, list = st.data || [];
    var HAZ = { flood: 'Inundación', fire: 'Incendio forestal', blackout: 'Apagón', infra: 'Fallo de infraestructura', mci: 'Víctimas múltiples', other: 'Otro' };
    var active = list.filter(function (c) { return c.status === 'active'; });
    var closed = list.filter(function (c) { return c.status !== 'active'; }).slice(0, 4);
    var big = active.length <= 4 ? 64 : active.length <= 6 ? 44 : 34;   // the more there are, the tighter the stack
    function row(c, i, on) {
      return { num: ('0' + (i + 1)).slice(-2), name: c.name, href: 'PanelCoordinacion.dc.html?c=' + c.id,
        size: on ? big : 28, pad: on ? Math.round(big * 0.44) : 12, color: on ? 'var(--ink)' : 'var(--ink-muted)',
        meta: (HAZ[c.hazard] || c.hazard) + ' · ' + c.code + (on ? ' · severidad ' + c.severity + '/10' : ' · cerrada') };
    }
    return {
      has: !st.loaded || list.length > 0, none: !!st.loaded && list.length === 0,
      crises: active.map(function (c, i) { return row(c, i, true); })
        .concat(closed.map(function (c, i) { return row(c, active.length + i, false); }))
    };
  }
}

</script>
