<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<!-- include: header -->
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px; padding: 0 12px;">
<section class="col" style="width: 430px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Por aprobar</h2><span class="count">{{pendingCount}}</span></div><div class="col-body"><sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line-strong);"><span class="lbl">Seleccionada · por qué lo hizo el agente</span><sc-for list="{{selList}}" as="a" hint-placeholder-count="1"><x-import component-from-global-scope="Valte.ActionItem" action="{{a.action}}" time="{{a.time}}" verb-label="{{a.verbLabel}}" actor-name="{{a.actorName}}" deadline="{{a.deadline}}" sc-camel-on-approve="{{a.approve}}" sc-camel-on-reject="{{a.reject}}"></x-import></sc-for></div></sc-if><sc-if value="{{noActs}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Nada espera a un humano ahora mismo.</div></sc-if><sc-for list="{{acts}}" as="a" hint-placeholder-count="2"><x-import component-from-global-scope="Valte.ActionItem" action="{{a.action}}" time="{{a.time}}" verb-label="{{a.verbLabel}}" actor-name="{{a.actorName}}" deadline="{{a.deadline}}" sc-camel-on-approve="{{a.approve}}" sc-camel-on-reject="{{a.reject}}"></x-import></sc-for></div></section><section class="col" style="flex-grow: 1;"><div class="col-head"><h2 class="col-title">Registro</h2><span class="count">{{logCount}}</span></div><div class="col-body"><div class="tabs" role="tablist"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.sel}}" sc-camel-on-click="{{t.pick}}">{{t.label}}</button></sc-for></div><div style="display: flex; flex-direction: column;"><div class="thead" style="grid-template-columns: 44px 64px minmax(0,1fr) 150px 104px 92px 164px;"><span>Hora</span><span>ID</span><span>Acción</span><span>Actor</span><span>Zonas</span><span>Contacto</span><span>Estado</span></div><sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><button type="button" class="{{r.cls}}" style="grid-template-columns: 44px 64px minmax(0,1fr) 150px 104px 92px 164px;" sc-camel-on-click="{{r.pick}}"><span class="mono muted">{{r.time}}</span><span class="mono" style="color: var(--info);">{{r.id}}</span><span class="ell" style="font-weight: 500;">{{r.label}}<sc-if value="{{r.hasInc}}" hint-placeholder-val="{{false}}"> <span class="mono" style="color: var(--info); font-weight: 400; font-size: 11px; cursor: pointer;" sc-camel-on-click="{{r.gotoInc}}">{{r.incId}}</span></sc-if></span><span class="ell">{{r.actor}}</span><span class="ell muted" style="font-size: 13px;">{{r.zones}}</span><span><sc-if value="{{r.real}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="Valte.StatusBadge" status="{{r.realStatus}}"></x-import></sc-if><sc-if value="{{r.noReal}}" hint-placeholder-val="{{true}}"><span class="muted">—</span></sc-if></span><span><x-import component-from-global-scope="Valte.StatusBadge" status="{{r.status}}"></x-import></span></button></sc-for><sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Nada en este filtro.</div></sc-if></div></div></section>
</div>
</div>
