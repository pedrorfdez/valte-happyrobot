<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<!-- include: header -->
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px; padding: 0 12px;">
<section class="col" style="flex-grow: 1;"><div class="col-head"><h2 class="col-title">Entrantes</h2><span class="count">{{sigsCount}}</span></div><div class="col-body"><div class="tabs" role="tablist"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.sel}}" sc-camel-on-click="{{t.pick}}">{{t.label}}</button></sc-for></div><sc-if value="{{noSigs}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Nada en este filtro.</div></sc-if><sc-for list="{{sigs}}" as="s" hint-placeholder-count="3"><x-import component-from-global-scope="Valte.SignalItem" signal="{{s.signal}}" time="{{s.time}}" source-name="{{s.sourceName}}" noise="{{s.noise}}"></x-import></sc-for></div></section><section class="col" style="width: 460px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Fuentes</h2><span class="count">{{sourcesCount}}</span></div><div class="col-body"><div style="display: flex; flex-direction: column;"><div class="thead" style="grid-template-columns: minmax(0,1fr) 128px 36px 44px;"><span>Fuente</span><span>Fiabilidad</span><span>Nº</span><span>Últ.</span></div><sc-for list="{{sources}}" as="f" hint-placeholder-count="6"><button type="button" class="trow" style="grid-template-columns: minmax(0,1fr) 128px 36px 44px;"><span class="ell" style="font-weight: 500;">{{f.name}}</span><span><x-import component-from-global-scope="Valte.StatusBadge" status="{{f.trust}}"></x-import></span><span class="mono">{{f.count}}</span><span class="mono muted">{{f.last}}</span></button></sc-for></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px;"><span class="lbl" style="padding-bottom: 4px;">Precisión de ubicación</span><sc-for list="{{precision}}" as="p" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: 150px minmax(0,1fr) 32px; align-items: center; gap: 12px; padding: 6px 0;"><span style="font-size: 13px; line-height: 20px;">{{p.label}}</span><span class="bar"><span style="width: {{p.pct}}%;"></span></span><span class="mono" style="text-align: right;">{{p.n}}</span></div></sc-for></div>
<div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; line-height: 20px;"><span class="muted">Ruido descartado por el agente</span><span class="mono">{{noiseLine}}</span></div><sc-if value="{{hasFallback}}" hint-placeholder-val="{{false}}"><div style="display: flex; justify-content: space-between; padding: 10px 0;  font-size: 13px; line-height: 20px;"><span class="muted">Percibidas por el respaldo local (HappyRobot no respondió)</span><span class="mono">{{fallbackLine}}</span></div></sc-if></div></section>
</div>
</div>
