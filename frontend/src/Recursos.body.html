<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
<!-- include: header -->
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px; padding: 0 12px;">
<section class="col" style="flex-grow: 1;"><div class="col-head"><h2 class="col-title">Unidades</h2><span class="count">{{unitsCount}}</span></div><div class="col-body"><div style="display: flex; flex-direction: column;"><div class="thead" style="grid-template-columns: minmax(0,1fr) 150px 160px 96px 124px;"><span>Entidad</span><span>Libres</span><span>Zonas</span><span>Activación</span><span>Estado</span></div><sc-for list="{{units}}" as="u" hint-placeholder-count="5"><button type="button" class="trow" style="grid-template-columns: minmax(0,1fr) 150px 160px 96px 124px;"><span style="display: flex; flex-direction: column;"><span class="ell" style="font-weight: 500;">{{u.name}}</span><span class="muted" style="font-size: 12px; line-height: 16px;">{{u.kind}}</span></span><span style="display: flex; flex-direction: column; gap: 4px;"><span class="mono">{{u.free}}</span><span class="{{u.barCls}}"><span style="width: {{u.pct}}%;"></span></span></span><span class="ell muted" style="font-size: 13px;">{{u.where}}</span><span class="mono">{{u.activation}}</span><span><x-import component-from-global-scope="Valte.StatusBadge" status="{{u.status}}"></x-import></span></button></sc-for><sc-if value="{{noUnits}}" hint-placeholder-val="{{false}}"><div class="vl-empty">{{noUnitsText}}</div></sc-if></div><span class="lbl" style="padding-top: 8px;">{{requestedLabel}}</span><sc-for list="{{requested}}" as="q" hint-placeholder-count="1"><div class="panel" style="gap: 10px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;"><span style="font-size: 16px; line-height: 24px; font-weight: 600;">{{q.title}}</span><x-import component-from-global-scope="Valte.StatusBadge" status="{{q.status}}"></x-import></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; line-height: 20px;"><span class="muted">Operativa en</span><span class="mono">{{q.eta}}</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; line-height: 20px;"><span class="muted">Acción</span><span class="mono" style="color: var(--info);">{{q.id}}</span></div></div></sc-for><sc-if value="{{noRequested}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Nada solicitado todavía.</div></sc-if></div></section><section class="col" style="width: 460px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Suministros</h2><span class="count">{{suppliesCount}}</span></div><div class="col-body"><sc-for list="{{supplies}}" as="r" hint-placeholder-count="6"><div style="padding: 10px 0; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="Valte.ResourceMeter" label="{{r.label}}" available="{{r.available}}" total="{{r.total}}" unit="{{r.unit}}"></x-import></div></sc-for><sc-if value="{{noSupplies}}" hint-placeholder-val="{{false}}"><div class="vl-empty">{{noSuppliesText}}</div></sc-if></div></section>
</div>
</div>
