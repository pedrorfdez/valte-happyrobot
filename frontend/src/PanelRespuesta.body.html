<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden; position: relative;">
<!-- include: header -->
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px; padding: 0 12px;">
<section class="col" style="width: 360px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Recursos</h2><span class="count">{{entityName}}</span></div><div class="col-body"><div style="padding-bottom: 8px; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="Valte.ResourceMeter" label="Unidades libres" available="{{uAvail}}" total="{{uTotal}}"></x-import></div>
<div style="display: flex; flex-direction: column;"><span class="lbl" style="padding: 8px 0 4px;">Desplegadas</span><sc-for list="{{deployed}}" as="p" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px;"><span style="flex-grow: 1;">{{p.zone}}</span><span style="font-family: var(--font-mono); font-size: 13px;">{{p.units}} ud.</span></div></sc-for><sc-if value="{{noDeployed}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Ninguna unidad desplegada.</div></sc-if></div>
<div style="display: flex; flex-direction: column;"><span class="lbl" style="padding: 8px 0 0;">Material</span><sc-for list="{{res}}" as="r" hint-placeholder-count="3"><div style="padding: 12px 0; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="Valte.ResourceMeter" label="{{r.label}}" available="{{r.available}}" total="{{r.total}}" unit="{{r.unit}}"></x-import></div></sc-for></div><div style="padding-top: 12px;"><x-import component-from-global-scope="Valte.Button" variant="secondary" block="{{yes}}" sc-camel-on-click="{{rp.show}}">⚑ Reportar incidencia</x-import></div></div></section><section class="col" style="flex-grow: 1;"><div class="col-head"><h2 class="col-title">Tareas</h2><span class="count">{{actsCount}}</span></div><div class="col-body"><sc-if value="{{noActs}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Sin tareas asignadas todavía.</div></sc-if><sc-for list="{{acts}}" as="a" hint-placeholder-count="2"><x-import component-from-global-scope="Valte.ActionItem" action="{{a.action}}" time="{{a.time}}" verb-label="{{a.verbLabel}}" actor-name="{{a.actorName}}" deadline="{{a.deadline}}" sc-camel-on-approve="{{a.approve}}" sc-camel-on-reject="{{a.reject}}"></x-import></sc-for></div></section><section class="col" style="width: 400px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Incidencias</h2><span class="count">{{incCount}}</span></div><div class="col-body"><sc-if value="{{noIncs}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Sin incidencias en tu zona.</div></sc-if><sc-for list="{{incs}}" as="i" hint-placeholder-count="3"><a href="{{i.href}}" style="text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line);">
<div style="display: flex; align-items: center; gap: 10px;"><span class="{{i.prioCls}}">{{i.priority}}</span><span class="ell" style="flex-grow: 1; font-weight: 500; font-size: 14px;">{{i.title}}</span><x-import component-from-global-scope="Valte.StatusBadge" tone="{{i.tone}}" label="{{i.stateLabel}}"></x-import></div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-muted);"><span class="ell">{{i.evidenceLabel}}</span><span class="ell" style="color: {{i.attColor}};">{{i.attention}}</span></div>
</a></sc-for></div></section>
</div>
<!-- include: report -->
</div>
