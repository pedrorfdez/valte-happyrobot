<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden; position: relative;">
<!-- include: header -->
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 32px; padding: 0 12px;">
<section class="col" style="width: 360px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Recursos</h2><span class="count">{{entityName}}</span></div><div class="col-body"><div style="padding-bottom: 8px; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="Valte.ResourceMeter" label="Unidades libres" available="{{uAvail}}" total="{{uTotal}}"></x-import></div>
<div style="display: flex; flex-direction: column;"><span class="lbl" style="padding: 8px 0 4px;">Desplegadas</span><sc-for list="{{deployed}}" as="p" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; line-height: 22px;"><span style="flex-grow: 1;">{{p.zone}}</span><span style="font-family: var(--font-mono); font-size: 13px;">{{p.units}} ud.</span></div></sc-for><sc-if value="{{noDeployed}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Ninguna unidad desplegada.</div></sc-if></div>
<div style="display: flex; flex-direction: column;"><span class="lbl" style="padding: 8px 0 0;">Material</span><sc-for list="{{res}}" as="r" hint-placeholder-count="3"><div style="padding: 12px 0; border-bottom: 1px solid var(--line);"><x-import component-from-global-scope="Valte.ResourceMeter" label="{{r.label}}" available="{{r.available}}" total="{{r.total}}" unit="{{r.unit}}"></x-import></div></sc-for></div><div style="padding-top: 12px;"><x-import component-from-global-scope="Valte.Button" variant="secondary" block="{{yes}}" sc-camel-on-click="{{rp.show}}">⚑ Reportar incidencia</x-import></div></div></section><section class="col" style="flex-grow: 1;"><div class="col-head"><h2 class="col-title">Tareas</h2><span class="count">{{actsCount}}</span></div><div class="col-body"><sc-if value="{{noActs}}" hint-placeholder-val="{{false}}"><div class="vl-empty">Sin tareas asignadas todavía.</div></sc-if><sc-for list="{{acts}}" as="a" hint-placeholder-count="2"><x-import component-from-global-scope="Valte.ActionItem" action="{{a.action}}" time="{{a.time}}" verb-label="{{a.verbLabel}}" actor-name="{{a.actorName}}" deadline="{{a.deadline}}" sc-camel-on-approve="{{a.approve}}" sc-camel-on-reject="{{a.reject}}"></x-import></sc-for></div></section><section class="col" style="width: 400px; flex-shrink: 0;"><div class="col-head"><h2 class="col-title">Señales</h2><span class="count">{{sigsCount}}</span></div><div class="col-body"><sc-for list="{{sigs}}" as="s" hint-placeholder-count="3"><x-import component-from-global-scope="Valte.SignalItem" signal="{{s.signal}}" time="{{s.time}}" source-name="{{s.sourceName}}" noise="{{s.noise}}"></x-import></sc-for></div></section>
</div>
<!-- include: report -->
</div>
