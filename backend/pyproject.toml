[project]
name = "valte-backend"
version = "0.2.0"
description = "Valte v2 — crisis coordination kernel for the HappyRobot track (HackSpain 2026)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]
# Local dictation for the "declare a crisis" text box (POST /stt). Optional at runtime: without it the endpoint answers 501.
stt = ["faster-whisper>=1.0"]

[tool.uv]
default-groups = ["dev", "stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
