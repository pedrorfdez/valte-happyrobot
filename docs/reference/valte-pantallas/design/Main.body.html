<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 16px; display: flex; gap: 16px; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

</a>

</nav>
</main>

<li style="display: flex; align-items: baseline; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--line-strong);"><span style="font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted); width: 24px;">03</span><span style="font-family: var(--font-display); font-size: 36px; line-height: 40px; letter-spacing: -0.01em;">Fuentes de datos</span></li>
<li style="display: flex; align-items: baseline; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--line-strong);"><span style="font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-muted); width: 24px;">04</span><span style="font-family: var(--font-display); font-size: 36px; line-height: 40px; letter-spacing: -0.01em;">Recursos disponibles</span></li></ol></div>
